[project]
name = "ma-higher-ed-geography"
version = "0.1.0"
description = "Geographic data pipeline for Massachusetts colleges and universities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyogrio>=0.11",
    "topojson>=1.9",
    "requests>=2.32",
]

[project.scripts]
ma-geo = "ma_geo.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ma_geo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
